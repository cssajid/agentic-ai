[project]
name = "backoffice_app"
version = "0.1.0"
description = "backoffice_app using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4"
]

[project.scripts]
backoffice_app = "backoffice_app.main:run"
run_crew = "backoffice_app.main:run"
train = "backoffice_app.main:train"
replay = "backoffice_app.main:replay"
test = "backoffice_app.main:test"
run_with_trigger = "backoffice_app.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
